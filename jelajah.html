<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Jelajah — DolanJogja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dj-primary:       #000055;
      --dj-primary-hover: #000077;
      --dj-primary-light: #E8E8F5;
      --dj-primary-soft:  #F0F0FA;
      --dj-secondary:     #C8922A;
      --dj-secondary-light:#FFF4DC;
      --dj-accent:        #E84855;
      --dj-green:         #2D7A4F;
      --dj-green-light:   #EBF7F0;
      --dj-dark:          #0D0D2B;
      --dj-ink:           #1C1C3A;
      --dj-muted:         #6B6B8A;
      --dj-border:        #DCDCEC;
      --dj-bg:            #F4F4FA;
      --dj-surface:       #FFFFFF;
      --dj-amber:         #C8922A;
      --dj-purple:        #6B4BC8;
      --dj-purple-light:  #F0ECFF;
      --dj-radius:        16px;
      --font-main:        'Plus Jakarta Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { background: var(--dj-bg); font-family: var(--font-main); margin: 0; padding: 0; overflow-x: hidden; }

    /* ── HEADER ── */
    .jelajah_header { background: var(--dj-primary); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100; }
    .jelajah_header_title { font-size: 17px; font-weight: 800; margin: 0; }
    .jelajah_header_sub { font-size: 11px; opacity: .7; margin: 2px 0 0; }

    /* ── SEARCH ── */
    .jelajah_search_wrap { background: var(--dj-surface); padding: 12px 16px; border-bottom: 1px solid var(--dj-border); position: sticky; top: 62px; z-index: 99; }
    .jelajah_search_row { display: flex; gap: 8px; align-items: center; }
    .jelajah_search_inner { position: relative; flex: 1; }
    .jelajah_search { background: var(--dj-bg); border: 1.5px solid var(--dj-border); border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 13px; width: 100%; outline: none; color: var(--dj-ink); font-family: var(--font-main); transition: border-color .2s; }
    .jelajah_search:focus { border-color: var(--dj-primary); }
    .jelajah_search_icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dj-muted); font-size: 14px; }

    /* ── FILTER TABS ── */
    .jelajah_filter_wrap { background: var(--dj-surface); border-bottom: 1px solid var(--dj-border); position: sticky; top: 118px; z-index: 98; }
    .jelajah_main_tabs_wrap { display: flex; padding: 0 16px; border-bottom: 1px solid var(--dj-border); }
    .jelajah_main_tab { flex: 1; text-align: center; padding: 12px 8px; font-size: 13px; font-weight: 700; color: var(--dj-muted); border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all .2s; font-family: var(--font-main); }
    .jelajah_main_tab.active { color: var(--dj-primary); border-bottom-color: var(--dj-primary); }
    .jelajah_cat_scroll { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
    .jelajah_cat_scroll::-webkit-scrollbar { display: none; }
    .jelajah_cat_chip { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--dj-border); font-size: 12px; font-weight: 600; color: var(--dj-muted); cursor: pointer; background: var(--dj-surface); transition: all .18s; white-space: nowrap; }
    .jelajah_cat_chip.active { background: var(--dj-primary); border-color: var(--dj-primary); color: #fff; }

    /* ── BODY ── */
    .jelajah_body { padding: 16px; }
    .jelajah_section_title { font-size: 14px; font-weight: 700; color: var(--dj-ink); margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; }

    /* ── HORIZONTAL SCROLL ── */
    .jelajah_hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
    .jelajah_hscroll::-webkit-scrollbar { display: none; }
    .jelajah_dest_card { flex-shrink: 0; width: 160px; background: var(--dj-surface); border-radius: var(--dj-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,85,.08); cursor: pointer; transition: transform .15s; border: 1px solid var(--dj-border); }
    .jelajah_dest_card:active { transform: scale(.97); }
    .jelajah_dest_thumb { width: 100%; height: 110px; object-fit: cover; display: block; background: var(--dj-bg); }
    .jelajah_dest_thumb.emoji-thumb { display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .jelajah_dest_body { padding: 10px; }
    .jelajah_dest_name { font-size: 12px; font-weight: 700; color: var(--dj-ink); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jelajah_dest_loc { font-size: 10px; color: var(--dj-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 3px; }
    .jelajah_dest_meta { display: flex; align-items: center; justify-content: space-between; }
    .jelajah_dest_rating { font-size: 11px; color: var(--dj-amber); font-weight: 600; }
    .jelajah_dest_cat { font-size: 10px; background: var(--dj-primary-light); color: var(--dj-primary); padding: 2px 7px; border-radius: 999px; font-weight: 600; }

    /* ── GRID ── */
    .jelajah_grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .jelajah_grid_card { background: var(--dj-surface); border-radius: var(--dj-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,85,.08); cursor: pointer; border: 1px solid var(--dj-border); transition: transform .15s; }
    .jelajah_grid_card:active { transform: scale(.97); }
    .jelajah_grid_thumb { width: 100%; height: 100px; object-fit: cover; display: block; background: var(--dj-bg); }
    .jelajah_grid_body { padding: 10px; }
    .jelajah_grid_name { font-size: 12px; font-weight: 700; color: var(--dj-ink); margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .jelajah_grid_sub { font-size: 10px; color: var(--dj-muted); }
    .jelajah_grid_meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .badge-gem { background: var(--dj-secondary-light); color: #6B4A00; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 700; }

    /* ── LOADING ── */
    .skeleton { background: linear-gradient(90deg, #e8e8f5 25%, #f4f4fa 50%, #e8e8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 10px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-card { width: 160px; height: 180px; flex-shrink: 0; }
    .skeleton-grid { height: 180px; }

    /* ══════════════════════════════════════════════════
       MODAL DETAIL WISATA
    ══════════════════════════════════════════════════ */
    .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,30,.55); z-index: 300; display: none; align-items: flex-end; }
    .detail-overlay.show { display: flex; }
    .detail-sheet { width: 100%; max-height: 92vh; background: var(--dj-surface); border-radius: 24px 24px 0 0; overflow-y: auto; animation: slideUp .3s ease; position: relative; }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Gallery */
    .detail-gallery { position: relative; }
    .gallery-scroll { display: flex; overflow-x: auto; gap: 0; scrollbar-width: none; }
    .gallery-scroll::-webkit-scrollbar { display: none; }
    .gallery-img { width: 100%; height: 230px; object-fit: cover; flex-shrink: 0; }
    .gallery-count { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .gallery-dots { display: flex; gap: 5px; justify-content: center; padding: 8px 0 0; }
    .gallery-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dj-border); transition: background .2s; }
    .gallery-dot.active { background: var(--dj-primary); width: 18px; border-radius: 3px; }

    /* Close btn */
    .detail-close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }

    /* Detail content */
    .detail-content { padding: 20px 16px 120px; }
    .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .detail-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .detail-badge.kategori { background: var(--dj-primary-light); color: var(--dj-primary); }
    .detail-badge.klaster { background: var(--dj-purple-light); color: var(--dj-purple); }
    .detail-badge.gem { background: var(--dj-secondary-light); color: #6B4A00; }
    .detail-badge.anak { background: var(--dj-green-light); color: var(--dj-green); }
    .detail-name { font-size: 20px; font-weight: 800; color: var(--dj-ink); margin: 0 0 4px; }
    .detail-rating { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .detail-stars { color: var(--dj-amber); font-size: 14px; }
    .detail-rating-num { font-size: 14px; font-weight: 700; color: var(--dj-ink); }
    .detail-rating-sub { font-size: 12px; color: var(--dj-muted); }

    .detail-info-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .detail-info-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dj-ink); background: var(--dj-bg); padding: 7px 12px; border-radius: 10px; }
    .detail-info-item i { color: var(--dj-primary); font-size: 13px; }

    .detail-section-label { font-size: 13px; font-weight: 700; color: var(--dj-ink); margin: 16px 0 8px; }
    .detail-desc { font-size: 13px; color: var(--dj-muted); line-height: 1.65; }
    .detail-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .detail-readmore { font-size: 12px; font-weight: 700; color: var(--dj-primary); background: none; border: none; padding: 4px 0; cursor: pointer; display: block; margin-top: 4px; }

    .detail-fasilitas { display: flex; flex-wrap: wrap; gap: 7px; }
    .detail-fasilitas-item { font-size: 11px; font-weight: 600; padding: 5px 11px; background: var(--dj-bg); border: 1px solid var(--dj-border); border-radius: 8px; color: var(--dj-ink); }

    .detail-lokasi { display: flex; align-items: flex-start; gap: 8px; background: var(--dj-bg); border-radius: 12px; padding: 12px; }
    .detail-lokasi i { color: var(--dj-accent); font-size: 16px; margin-top: 1px; }
    .detail-lokasi-text { font-size: 12px; color: var(--dj-muted); line-height: 1.5; flex: 1; }

    /* ── ACTION BUTTONS (fixed bottom) ── */
    .detail-actions { position: fixed; bottom: 0; left: 0; right: 0; background: var(--dj-surface); border-top: 1px solid var(--dj-border); padding: 12px 16px; display: none; gap: 8px; z-index: 400; }
    .detail-actions.show { display: flex; }
    .btn-action-maps { flex: 1; background: var(--dj-primary-light); color: var(--dj-primary); border: 1.5px solid var(--dj-primary); border-radius: 12px; padding: 11px 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-main); }
    .btn-action-add { flex: 1; background: var(--dj-primary); color: #fff; border: none; border-radius: 12px; padding: 11px 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-main); }
    .btn-action-wa { width: 46px; height: 46px; background: #25D366; color: #fff; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .btn-action-ai { width: 46px; height: 46px; background: linear-gradient(135deg, #6B4BC8, #000055); color: #fff; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; position: relative; }
    .btn-action-ai::after { content: 'AI'; position: absolute; bottom: 5px; font-size: 8px; font-weight: 800; letter-spacing: .02em; }

    /* ══════════════════════════════════════════════════
       MODAL AI CHAT
    ══════════════════════════════════════════════════ */
    .ai-overlay { position: fixed; inset: 0; background: rgba(0,0,30,.6); z-index: 500; display: none; align-items: flex-end; }
    .ai-overlay.show { display: flex; }
    .ai-sheet { width: 100%; height: 75vh; background: var(--dj-surface); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: slideUp .3s ease; }
    .ai-header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--dj-border); }
    .ai-header-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6B4BC8, #000055); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; flex-shrink: 0; }
    .ai-header-info h4 { font-size: 14px; font-weight: 800; color: var(--dj-ink); margin: 0; }
    .ai-header-info p { font-size: 11px; color: var(--dj-muted); margin: 0; }
    .ai-close { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--dj-bg); border: none; color: var(--dj-muted); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .ai-context-chip { margin: 8px 16px; background: var(--dj-primary-soft); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--dj-primary); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .ai-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
    .ai-messages::-webkit-scrollbar { width: 3px; }
    .ai-messages::-webkit-scrollbar-thumb { background: var(--dj-border); border-radius: 3px; }
    .ai-msg { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp .25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .ai-msg.user { flex-direction: row-reverse; }
    .ai-msg-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .ai-msg.ai .ai-msg-av { background: linear-gradient(135deg, #6B4BC8, #000055); color: #fff; }
    .ai-msg.user .ai-msg-av { background: var(--dj-bg); border: 1px solid var(--dj-border); }
    .ai-bubble { max-width: 80%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .ai-msg.ai .ai-bubble { background: var(--dj-bg); border: 1px solid var(--dj-border); border-top-left-radius: 4px; color: var(--dj-ink); }
    .ai-msg.user .ai-bubble { background: var(--dj-primary); color: #fff; border-top-right-radius: 4px; }
    .ai-typing { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
    .ai-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--dj-muted); animation: dot 1.2s infinite ease-in-out; opacity: .4; }
    .ai-typing span:nth-child(2) { animation-delay: .2s; }
    .ai-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,80%,100%{transform:scale(1);opacity:.4}40%{transform:scale(1.3);opacity:1} }
    .ai-quick { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 8px; scrollbar-width: none; }
    .ai-quick::-webkit-scrollbar { display: none; }
    .ai-quick-btn { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 20px; background: var(--dj-bg); border: 1px solid var(--dj-border); color: var(--dj-ink); cursor: pointer; white-space: nowrap; font-family: var(--font-main); }
    .ai-input-row { display: flex; gap: 8px; padding: 10px 16px 16px; border-top: 1px solid var(--dj-border); }
    .ai-input { flex: 1; background: var(--dj-bg); border: 1.5px solid var(--dj-border); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: var(--font-main); outline: none; color: var(--dj-ink); resize: none; max-height: 80px; }
    .ai-input:focus { border-color: var(--dj-primary); }
    .ai-send { width: 42px; height: 42px; border-radius: 12px; background: var(--dj-primary); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .ai-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── TOAST ── */
    .dj-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--dj-dark); color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 999; animation: fadeUp .3s ease; white-space: nowrap; }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="jelajah_header">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <p class="jelajah_header_title">🗺️ Jelajah Destinasi</p>
      <p class="jelajah_header_sub">Temukan wisata terbaik Yogyakarta</p>
    </div>
    <div id="totalCount" style="font-size:11px;opacity:.7"></div>
  </div>
</div>

<!-- ══ SEARCH ══ -->
<div class="jelajah_search_wrap">
  <div class="jelajah_search_row">
    <div class="jelajah_search_inner">
      <i class="fa fa-search jelajah_search_icon"></i>
      <input type="text" class="jelajah_search" id="searchInput" placeholder="Cari destinasi wisata...">
    </div>
  </div>
</div>

<!-- ══ FILTER TABS ══ -->
<div class="jelajah_filter_wrap">
  <div class="jelajah_main_tabs_wrap" id="klasterTabs">
    <button class="jelajah_main_tab active" data-klaster="">Semua</button>
    <button class="jelajah_main_tab" data-klaster="Pusat">Pusat</button>
    <button class="jelajah_main_tab" data-klaster="Utara">Utara</button>
    <button class="jelajah_main_tab" data-klaster="Selatan">Selatan</button>
    <button class="jelajah_main_tab" data-klaster="Timur">Timur</button>
    <button class="jelajah_main_tab" data-klaster="Barat">Barat</button>
  </div>
  <div class="jelajah_cat_scroll" id="kategoriChips">
    <button class="jelajah_cat_chip active" data-kategori="">Semua</button>
    <button class="jelajah_cat_chip" data-kategori="Alam">🌿 Alam</button>
    <button class="jelajah_cat_chip" data-kategori="Sejarah">🏛️ Sejarah</button>
    <button class="jelajah_cat_chip" data-kategori="Budaya">🎭 Budaya</button>
    <button class="jelajah_cat_chip" data-kategori="Rekreasi">🎡 Rekreasi</button>
    <button class="jelajah_cat_chip" data-kategori="Belanja">🛍️ Belanja</button>
    <button class="jelajah_cat_chip" data-kategori="Museum">🏛 Museum</button>
    <button class="jelajah_cat_chip" data-kategori="Kuliner">🍜 Kuliner</button>
  </div>
</div>

<!-- ══ BODY ══ -->
<div class="jelajah_body">

  <!-- Hidden Gems Section -->
  <div id="sectionHiddenGem" style="margin-bottom:24px">
    <div class="jelajah_section_title">
      <span>💎 Hidden Gems</span>
    </div>
    <div class="jelajah_hscroll" id="listHiddenGem">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <!-- All Wisata Grid -->
  <div>
    <div class="jelajah_section_title">
      <span id="sectionGridTitle">Semua Destinasi</span>
    </div>
    <div class="jelajah_grid" id="gridWisata">
      <div class="skeleton skeleton-grid"></div>
      <div class="skeleton skeleton-grid"></div>
      <div class="skeleton skeleton-grid"></div>
      <div class="skeleton skeleton-grid"></div>
    </div>
    <div id="loadMoreWrap" style="text-align:center;margin-top:16px;display:none">
      <button id="btnLoadMore" onclick="loadMore()" style="background:var(--dj-primary-light);color:var(--dj-primary);border:1.5px solid var(--dj-primary);border-radius:12px;padding:10px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-main);">
        Muat Lebih Banyak
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL DETAIL WISATA
══════════════════════════════════════ -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-sheet" id="detailSheet">
    <button class="detail-close" onclick="closeDetailBtn()"><i class="fa fa-times"></i></button>

    <!-- Gallery -->
    <div class="detail-gallery" id="detailGallery">
      <div class="gallery-scroll" id="galleryScroll"></div>
      <div class="gallery-count" id="galleryCount">1 / 1</div>
    </div>
    <div class="gallery-dots" id="galleryDots"></div>

    <!-- Content -->
    <div class="detail-content">
      <div class="detail-badges" id="detailBadges"></div>
      <h2 class="detail-name" id="detailName">—</h2>

      <div class="detail-rating">
        <div class="detail-stars" id="detailStars"></div>
        <span class="detail-rating-num" id="detailRatingNum"></span>
        <span class="detail-rating-sub" id="detailRatingSub"></span>
      </div>

      <!-- Info Row -->
      <div class="detail-info-row" id="detailInfoRow"></div>

      <!-- Deskripsi -->
      <div class="detail-section-label">Tentang Tempat Ini</div>
      <div class="detail-desc collapsed" id="detailDesc"></div>
      <button class="detail-readmore" id="btnReadMore" onclick="toggleReadMore()">Baca selengkapnya ▾</button>

      <!-- Fasilitas -->
      <div class="detail-section-label">Fasilitas</div>
      <div class="detail-fasilitas" id="detailFasilitas"></div>

      <!-- Lokasi -->
      <div class="detail-section-label">Lokasi</div>
      <div class="detail-lokasi" id="detailLokasi">
        <i class="fa fa-map-marker-alt"></i>
        <span class="detail-lokasi-text" id="detailLokasiText"></span>
      </div>

</div>

<!-- Action Buttons (fixed bottom) -->
<div class="detail-actions" id="detailActions">

<!-- ══════════════════════════════════════
     MODAL AI CHAT
══════════════════════════════════════ -->
<div class="ai-overlay" id="aiOverlay" onclick="closeAI(event)">
  <div class="ai-sheet" onclick="event.stopPropagation()">
    <div class="ai-header">
      <div class="ai-header-avatar">🤖</div>

<!-- ══ SCRIPTS ══ -->
<script>
// ======================================================
// STATE
// ======================================================
let currentKlaster  = '';
let currentKategori = '';
let currentSearch   = '';
let currentOffset   = 0;
const LIMIT         = 20;
let totalWisata     = 0;
let activeWisata    = null;   // data wisata yang sedang dibuka
let aiHistory       = [];
let isAILoading     = false;
let descExpanded    = false;
let galeriData      = [];
let galeriIndex     = 0;

const API_URL    = 'api_wisata.php';
const AI_URL     = 'ai_wisata.php';

// ======================================================
// INIT
// ======================================================
document.addEventListener('DOMContentLoaded', () => {
  loadHiddenGems();
  loadGrid(true);
  initSearch();
  initFilters();
});

// ======================================================
// LOAD HIDDEN GEMS (horizontal scroll)
// ======================================================
async function loadHiddenGems() {
  const container = document.getElementById('listHiddenGem');
  try {
    const res  = await fetch(`${API_URL}?action=list&hidden=1&limit=10`);
    const json = await res.json();
    if (!json.success || !json.data.length) {
      document.getElementById('sectionHiddenGem').style.display = 'none';
      return;
    }
    container.innerHTML = json.data.map(w => renderHScrollCard(w)).join('');
  } catch (e) {
    document.getElementById('sectionHiddenGem').style.display = 'none';
  }
}

function renderHScrollCard(w) {
  const stars = renderStars(w.stat_stars);
  const foto  = w.foto_utama
    ? `<img class="jelajah_dest_thumb" src="${escHtml(w.foto_utama)}" alt="${escHtml(w.nama_tempat)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'jelajah_dest_thumb emoji-thumb\\'>${jenisEmoji(w.jenis_wisata)}</div>'">`
    : `<div class="jelajah_dest_thumb emoji-thumb">${jenisEmoji(w.jenis_wisata)}</div>`;
  return `
  <div class="jelajah_dest_card" onclick="bukaDetail(${w.id_wisata})">
    ${foto}
    <div class="jelajah_dest_body">
      <div class="jelajah_dest_name">${escHtml(w.nama_tempat)}</div>
      <div class="jelajah_dest_loc"><i class="fa fa-map-pin" style="font-size:9px"></i>${escHtml(w.klaster)}</div>
      <div class="jelajah_dest_meta">
        <span class="jelajah_dest_rating">★ ${w.stat_stars.toFixed(1)}</span>
        <span class="jelajah_dest_cat">${escHtml(w.jenis_wisata)}</span>
      </div>
    </div>
  </div>`;
}

// ======================================================
// LOAD GRID WISATA
// ======================================================
async function loadGrid(reset = false) {
  if (reset) {
    currentOffset = 0;
    document.getElementById('gridWisata').innerHTML = '<div class="skeleton skeleton-grid"></div><div class="skeleton skeleton-grid"></div><div class="skeleton skeleton-grid"></div><div class="skeleton skeleton-grid"></div>';
    document.getElementById('loadMoreWrap').style.display = 'none';
  }

  const params = new URLSearchParams({
    action: 'list',
    limit:  LIMIT,
    offset: currentOffset,
  });
  if (currentKlaster)  params.append('klaster',  currentKlaster);
  if (currentKategori) params.append('kategori', currentKategori);
  if (currentSearch)   params.append('search',   currentSearch);

  try {
    const res  = await fetch(`${API_URL}?${params}`);
    const json = await res.json();
    if (!json.success) return;

    totalWisata = json.total;
    document.getElementById('totalCount').textContent = totalWisata + ' destinasi';
    document.getElementById('sectionGridTitle').textContent =
      currentSearch ? `Hasil: "${currentSearch}"` :
      (currentKategori || currentKlaster) ? 'Destinasi Tersaring' : 'Semua Destinasi';

    if (reset) {
      document.getElementById('gridWisata').innerHTML = json.data.length
        ? json.data.map(w => renderGridCard(w)).join('')
        : '<p style="color:var(--dj-muted);font-size:13px;grid-column:1/-1;text-align:center;padding:24px 0">Tidak ada destinasi ditemukan</p>';
    } else {
      document.getElementById('gridWisata').insertAdjacentHTML('beforeend', json.data.map(w => renderGridCard(w)).join(''));
    }

    currentOffset += json.data.length;
    document.getElementById('loadMoreWrap').style.display =
      currentOffset < totalWisata ? 'block' : 'none';

  } catch (e) {
    document.getElementById('gridWisata').innerHTML = '<p style="color:var(--dj-muted);font-size:13px;grid-column:1/-1;text-align:center;padding:24px 0">Gagal memuat data</p>';
  }
}

function loadMore() {
  loadGrid(false);
}

function renderGridCard(w) {
  const foto = w.foto_utama
    ? `<img class="jelajah_grid_thumb" src="${escHtml(w.foto_utama)}" alt="${escHtml(w.nama_tempat)}" loading="lazy" onerror="this.src='';this.style.display='none'">`
    : `<div class="jelajah_grid_thumb emoji-thumb" style="display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--dj-bg)">${jenisEmoji(w.jenis_wisata)}</div>`;
  const gemBadge = w.is_hidden_gem ? '<span class="badge-gem">💎 Hidden Gem</span>' : '';
  return `
  <div class="jelajah_grid_card" onclick="bukaDetail(${w.id_wisata})">
    ${foto}
    <div class="jelajah_grid_body">
      <div class="jelajah_grid_name">${escHtml(w.nama_tempat)}</div>
      <div class="jelajah_grid_sub">${escHtml(w.klaster)} · ${escHtml(w.kabupaten)}</div>
      <div class="jelajah_grid_meta">
        <span style="font-size:11px;color:var(--dj-amber);font-weight:600">★ ${w.stat_stars.toFixed(1)}</span>
        ${gemBadge}
        <span style="font-size:10px;color:var(--dj-muted)">${escHtml(w.harga_label)}</span>
      </div>
    </div>
  </div>`;
}

// ======================================================
// BUKA DETAIL WISATA
// ======================================================
async function bukaDetail(id) {
  // Show skeleton loading
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailActions').classList.add('show');
  document.getElementById('detailName').textContent = 'Memuat...';
  document.getElementById('detailDesc').textContent = '';
  document.getElementById('galleryScroll').innerHTML = '<div style="width:100%;height:230px;background:var(--dj-bg);display:flex;align-items:center;justify-content:center;color:var(--dj-muted);font-size:13px">Memuat galeri...</div>';
  document.getElementById('detailBadges').innerHTML   = '';
  document.getElementById('detailInfoRow').innerHTML  = '';
  document.getElementById('detailFasilitas').innerHTML= '';
  document.body.style.overflow = 'hidden';
  descExpanded = false;

  try {
    const res  = await fetch(`${API_URL}?action=detail&id=${id}`);
    const json = await res.json();
    if (!json.success) { closeDetailBtn(); showToast('Gagal memuat detail'); return; }

    const w = json.wisata;
    galeriData = json.galeri || [];
    activeWisata = { ...w, fasilitas: w.fasilitas, galeri: galeriData };

    // Nama & badges
    document.getElementById('detailName').textContent = w.nama_tempat;

    const badges = [];
    badges.push(`<span class="detail-badge kategori">${jenisEmoji(w.jenis_wisata)} ${w.jenis_wisata}</span>`);
    badges.push(`<span class="detail-badge klaster">${w.klaster} · ${w.kabupaten}</span>`);
    if (w.is_hidden_gem) badges.push('<span class="detail-badge gem">💎 Hidden Gem</span>');
    if (w.is_ramah_anak) badges.push('<span class="detail-badge anak">👧 Ramah Anak</span>');
    document.getElementById('detailBadges').innerHTML = badges.join('');

    // Rating
    document.getElementById('detailStars').innerHTML = renderStars(w.stat_stars);
    document.getElementById('detailRatingNum').textContent = w.stat_stars.toFixed(1);
    document.getElementById('detailRatingSub').textContent = `(${w.stat_ulasan} ulasan)`;

    // Info row
    const infos = [
      `<i class="fa fa-clock"></i> ${w.jam_label}`,
      `<i class="fa fa-ticket-alt"></i> ${w.harga_label}`,
      `<i class="fa fa-users"></i> ${w.tingkat_kepadatan || 'Sedang'}`,
    ];
    if (w.zona_tiket) infos.push(`<i class="fa fa-layer-group"></i> ${w.zona_tiket}`);
    document.getElementById('detailInfoRow').innerHTML = infos.map(i => `<span class="detail-info-item">${i}</span>`).join('');

    // Deskripsi
    document.getElementById('detailDesc').textContent = w.deskripsi || w.deskripsi_ai || '';
    document.getElementById('detailDesc').classList.add('collapsed');
    document.getElementById('btnReadMore').style.display = '';

    // Fasilitas (hardcode dari API)
    const fasilitas = w.fasilitas || [];
    document.getElementById('detailFasilitas').innerHTML = fasilitas
      .map(f => `<span class="detail-fasilitas-item">✓ ${escHtml(f)}</span>`).join('');

      if (w.tips) {
      const tipsHtml = `
      <div class="detail-section-label">Tips Lokal</div>
      <div style="background:#FFF8EC;border-radius:12px;padding:12px;font-size:12px;color:#6B4A00;line-height:1.6">
      💡 ${escHtml(w.tips)}
      </div>`;

      let tipsEl = document.getElementById('detailTips');
      if (tipsEl) {
      // Sudah ada → ganti isinya
      tipsEl.innerHTML = tipsHtml;
      } else {
      // Belum ada → buat dan sisipkan setelah detailFasilitas
      tipsEl = document.createElement('div');
      tipsEl.id = 'detailTips';
      tipsEl.innerHTML = tipsHtml;
      document.getElementById('detailFasilitas').insertAdjacentElement('afterend', tipsEl);
      }
      } else {
      // Kalau tidak ada tips, hapus elemennya kalau masih ada
      const tipsEl = document.getElementById('detailTips');
      if (tipsEl) tipsEl.remove();
      }
      // Lokasi
    document.getElementById('detailLokasiText').textContent = w.lokasi;

    // Gallery
    renderGallery(galeriData, w.foto_utama, w.nama_tempat);

  } catch (e) {
    showToast('Gagal memuat detail wisata');
    closeDetailBtn();
  }
}

function renderGallery(galeri, fotoUtama, nama) {
  const scroll = document.getElementById('galleryScroll');
  const dots   = document.getElementById('galleryDots');
  const count  = document.getElementById('galleryCount');

  let imgs = galeri.length
    ? galeri.map(g => ({ src: g.link_foto, caption: g.caption }))
    : [{ src: fotoUtama, caption: nama }];

  if (!imgs[0].src) {
    imgs = [{ src: null, caption: nama }];
  }

  scroll.innerHTML = imgs.map((img, i) => img.src
    ? `<img class="gallery-img" src="${escHtml(img.src)}" alt="${escHtml(img.caption || nama)}" data-idx="${i}">`
    : `<div class="gallery-img" style="display:flex;align-items:center;justify-content:center;font-size:60px;background:var(--dj-bg)">🗺️</div>`
  ).join('');

  dots.innerHTML = imgs.length > 1
    ? imgs.map((_, i) => `<div class="gallery-dot${i===0?' active':''}" id="dot${i}"></div>`).join('')
    : '';

  count.textContent = `1 / ${imgs.length}`;
  galeriIndex = 0;

  if (imgs.length > 1) {
    scroll.addEventListener('scroll', () => {
      const idx = Math.round(scroll.scrollLeft / scroll.clientWidth);
      if (idx !== galeriIndex) {
        galeriIndex = idx;
        count.textContent = `${idx + 1} / ${imgs.length}`;
        document.querySelectorAll('.gallery-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
      }
    });
  }
}

function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetailBtn();
}
function closeDetailBtn() {
  document.getElementById('detailOverlay').classList.remove('show');
  document.getElementById('detailActions').classList.remove('show');
  document.body.style.overflow = '';
  activeWisata = null;
  aiHistory = [];
}

function toggleReadMore() {
  descExpanded = !descExpanded;
  const desc = document.getElementById('detailDesc');
  const btn  = document.getElementById('btnReadMore');
  desc.classList.toggle('collapsed', !descExpanded);
  btn.textContent = descExpanded ? 'Sembunyikan ▴' : 'Baca selengkapnya ▾';
}

// ======================================================
// ACTION BUTTONS
// ======================================================
function bukaGmaps() {
  if (!activeWisata) return;
  const url = activeWisata.link_gmaps ||
    `https://www.google.com/maps?q=${activeWisata.latitude},${activeWisata.longitude}`;
  window.open(url, '_blank');
}

function tambahItinerary() {
  if (!activeWisata) return;
  // Kirim data ke parent (jika dalam iframe/webview dari halaman itinerary)
  const payload = {
    type: 'tambah_itinerary',
    wisata: {
      id:       activeWisata.id_wisata,
      nama:     activeWisata.nama_tempat,
      kategori: activeWisata.jenis_wisata,
      wilayah:  activeWisata.klaster,
      lokasi:   activeWisata.lokasi,
      harga:    activeWisata.harga_label,
      jam:      activeWisata.jam_label,
      lat:      activeWisata.latitude,
      lng:      activeWisata.longitude,
    }
  };
  if (window.parent !== window) {
    window.parent.postMessage(payload, '*');
  }
  showToast('✅ ' + activeWisata.nama_tempat + ' ditambahkan ke itinerary!');
}

function shareWA() {
  if (!activeWisata) return;
  const nama  = activeWisata.nama_tempat;
  const lokasi = activeWisata.lokasi;
  const harga  = activeWisata.harga_label;
  const maps   = activeWisata.link_gmaps || '';
  const text   = `🗺️ *${nama}*\n📍 ${lokasi}\n🎫 Tiket: ${harga}\n\n📲 Lokasi: ${maps}\n\n_Dibagikan via DolanJogja_`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

// ======================================================
// AI CHAT
// ======================================================
function bukaAI() {
  if (!activeWisata) return;
  document.getElementById('aiContextName').textContent = activeWisata.nama_tempat;
  document.getElementById('aiMessages').innerHTML = `
    <div class="ai-msg ai">
      <div class="ai-msg-av">🤖</div>
      <div class="ai-bubble">Halo! Saya siap bantu kamu tentang <strong>${escHtml(activeWisata.nama_tempat)}</strong> 😊 Mau tanya apa?</div>
    </div>`;
  aiHistory = [];
  document.getElementById('aiOverlay').classList.add('show');
  document.getElementById('aiInput').focus();
}

function closeAI(e) {
  if (e.target === document.getElementById('aiOverlay')) closeAIBtn();
}
function closeAIBtn() {
  document.getElementById('aiOverlay').classList.remove('show');
}

function quickAsk(text) {
  document.getElementById('aiInput').value = text;
  kirimAI();
}

async function kirimAI() {
  const input = document.getElementById('aiInput');
  const text  = input.value.trim();
  if (!text || isAILoading || !activeWisata) return;

  isAILoading = true;
  document.getElementById('aiSendBtn').disabled = true;
  input.value = '';
  aiAutoResize(input);

  appendAIMsg('user', text);
  aiHistory.push({ role: 'user', content: text });

  const typingEl = appendAITyping();

  try {
    const res  = await fetch(AI_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        message: text,
        wisata:  activeWisata,
        history: aiHistory.slice(0, -1),
      }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Gagal mendapat respons AI');

    aiHistory.push({ role: 'assistant', content: data.reply });
    typingEl.querySelector('.ai-bubble').textContent = data.reply;

  } catch (e) {
    typingEl.querySelector('.ai-bubble').textContent = '❌ ' + e.message;
  } finally {
    isAILoading = false;
    document.getElementById('aiSendBtn').disabled = false;
    input.focus();
  }
}

function appendAIMsg(role, text) {
  const msgs = document.getElementById('aiMessages');
  const el   = document.createElement('div');
  el.className = `ai-msg ${role}`;
  el.innerHTML = `
    <div class="ai-msg-av">${role === 'ai' ? '🤖' : '👤'}</div>
    <div class="ai-bubble">${escHtml(text)}</div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function appendAITyping() {
  const msgs = document.getElementById('aiMessages');
  const el   = document.createElement('div');
  el.className = 'ai-msg ai';
  el.innerHTML = `
    <div class="ai-msg-av">🤖</div>
    <div class="ai-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function aiHandleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); kirimAI(); }
}
function aiAutoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

// ======================================================
// FILTER & SEARCH
// ======================================================
function initFilters() {
  // Klaster tabs
  document.getElementById('klasterTabs').addEventListener('click', e => {
    const btn = e.target.closest('.jelajah_main_tab');
    if (!btn) return;
    document.querySelectorAll('.jelajah_main_tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentKlaster = btn.dataset.klaster;
    loadGrid(true);
  });

  // Kategori chips
  document.getElementById('kategoriChips').addEventListener('click', e => {
    const btn = e.target.closest('.jelajah_cat_chip');
    if (!btn) return;
    document.querySelectorAll('.jelajah_cat_chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentKategori = btn.dataset.kategori;
    loadGrid(true);
  });
}

function initSearch() {
  let debounce;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      currentSearch = e.target.value.trim();
      // Sembunyikan hidden gems saat search aktif
      document.getElementById('sectionHiddenGem').style.display = currentSearch ? 'none' : '';
      loadGrid(true);
    }, 400);
  });
}

// ======================================================
// HELPERS
// ======================================================
function renderStars(rating) {
  const full  = Math.floor(rating);
  const half  = (rating % 1) >= 0.5;
  let html = '';
  for (let i = 0; i < 5; i++) {
    if (i < full) html += '<i class="fa fa-star"></i>';
    else if (i === full && half) html += '<i class="fa fa-star-half-alt"></i>';
    else html += '<i class="far fa-star"></i>';
  }
  return html;
}

function jenisEmoji(jenis) {
  const map = { Alam:'🌿', Sejarah:'🏛️', Budaya:'🎭', Rekreasi:'🎡', Belanja:'🛍️', Museum:'🏺', Kuliner:'🍜' };
  return map[jenis] || '📍';
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, duration = 2500) {
  const t = document.createElement('div');
  t.className = 'dj-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), duration);
}
</script>
