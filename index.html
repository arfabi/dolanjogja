<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000055">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DolanJogja">
<link rel="manifest" href="manifest.json">
<title>DolanJogja</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Biker&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --dj-primary:#000055;
  --dj-secondary:#C8922A;
  --dj-muted:#6B6B8A;
  --dj-border:#DCDCEC;
  --dj-bg:#F4F4FA;
  --nav-h:68px;
  --font-main:'Plus Jakarta Sans',sans-serif;
  --font-display:'Biker','Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);background:var(--dj-bg);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
#page-content{min-height:calc(100vh - var(--nav-h));padding-bottom:var(--nav-h);}
#page-content iframe{width:100%;height:calc(100vh - var(--nav-h));border:none;display:block;}
.dj-bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nav-h);background:#fff;border-top:1px solid var(--dj-border);display:flex;align-items:stretch;z-index:1000;box-shadow:0 -4px 24px rgba(0,0,85,.10);}
.nav-item-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--dj-muted);font-family:var(--font-main);font-size:11px;font-weight:500;cursor:pointer;transition:color .2s;padding:8px 4px 10px;position:relative;}
.nav-item-btn i{font-size:20px;transition:transform .2s;}
.nav-item-btn.active{color:var(--dj-primary);}
.nav-item-btn.active i{transform:translateY(-2px);}
.nav-item-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--dj-secondary);border-radius:0 0 4px 4px;}
#splash{position:fixed;inset:0;background:linear-gradient(150deg,#000033 0%,#000055 55%,#00007A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-family:var(--font-display);font-size:52px;font-weight:400;color:#fff;letter-spacing:.5px;}
.splash-logo span{color:var(--dj-secondary);}
.splash-sub{color:rgba(255,255,255,.65);font-size:13px;margin-top:8px;letter-spacing:.3px;}
.splash-dots{display:flex;gap:6px;margin-top:36px;}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);animation:sdot 1.4s ease-in-out infinite;}
.splash-dots span:nth-child(1){animation-delay:0s;}
.splash-dots span:nth-child(2){animation-delay:.18s;background:rgba(200,146,42,.6);}
.splash-dots span:nth-child(3){animation-delay:.36s;}
@keyframes sdot{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1.2);opacity:1;background:var(--dj-secondary);}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-logo">Dolan<span>Jogja</span></div>
  <div class="splash-sub">Jogja Smart Travel Companion</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>
<div id="page-content">
  <iframe id="main-iframe" src="asisten.html" title="Konten"></iframe>
</div>
<nav class="dj-bottom-nav">
  <button class="nav-item-btn active" data-page="asisten.html" onclick="navigate(this)">
    <i class="fa-solid fa-wand-magic-sparkles"></i><span>Asisten</span>
  </button>
  <button class="nav-item-btn" data-page="jelajah.html" onclick="navigate(this)">
    <i class="fa-solid fa-compass"></i><span>Jelajah</span>
  </button>
  <button class="nav-item-btn" data-page="inspirasi.html" onclick="navigate(this)">
    <i class="fa-solid fa-fire-flame-curved"></i><span>Inspirasi</span>
  </button>
  <button class="nav-item-btn" data-page="trip.html" onclick="navigate(this)">
    <i class="fa-solid fa-suitcase-rolling"></i><span>Trip Saya</span>
  </button>
</nav>
<script>
function navigate(btn){
  document.querySelectorAll('.nav-item-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('main-iframe').src=btn.dataset.page;
}
window.navigateGlobal=function(page){
  document.querySelectorAll('.nav-item-btn').forEach(b=>{
    b.classList.remove('active');
    if(b.dataset.page===page)b.classList.add('active');
  });
  document.getElementById('main-iframe').src=page;
};
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>document.getElementById('splash').remove(),500);
  },1400);
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
